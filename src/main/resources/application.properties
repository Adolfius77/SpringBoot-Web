spring.application.name=PracticaSpringBoot
# Buscar recursos estáticos en /views/ y en /estilos/
spring.web.resources.static-locations=classpath:/views/,classpath:/estilos/

spring.datasource.url=jdbc:mysql://localhost:3306/practica?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect